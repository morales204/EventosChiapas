name: "CI - SonarCloud en GitHub Actions"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build project (if needed)
        run: npm run build --if-present

      - name: Run tests and generate coverage (optional)
        run: |
          if [ -f "jest.config.js" ]; then
            npm test -- --coverage
          else
            echo "No test config found, skipping tests"
          fi

      - name: List coverage files
        if: always()
        run: ls -la coverage || echo "No coverage directory"

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v3.1.0
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=SonarCloudCodeAnalysis
            -Dsonar.host.url=https://sonarcloud.io
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
